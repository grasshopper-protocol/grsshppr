name: CI

# Correctness gates on every PR and push to main. No secrets needed:
# all checks are pure static analysis or self-contained unit tests.
# `next build` is intentionally omitted — it hits the DB during static
# generation and would be flaky without production secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hard gate: tests must pass and pure-logic coverage must hold.
      # Thresholds are enforced in the `test:coverage` script (src/lib only).
      - name: Test + coverage
        run: pnpm test:coverage

      # Hard gate: the build must typecheck.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Advisory until the existing lint debt is cleared, then promote to a hard
      # gate (drop continue-on-error) and add "quality" to branch protection.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true

  # Hard gate: a real production build must succeed. `quality` only runs `tsc`,
  # which does NOT catch build/bundler/deploy-time failures (see ADR-0012 and the
  # 2026-08-24 Next 16.3 Turbopack tracing incident). Uses an ephemeral Postgres
  # so static generation can run; no production secrets required.
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # ponytail: tag-pinned; upgrade path is a digest pin if supply-chain review requires it
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grasshopper_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grasshopper_ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Build
        run: pnpm build
